    <style>
      :root {
        /* Нейтральные */
        --background: #f7f8f6;
        --surface: #ffffff;
        --surface-muted: #f0f2ee;
        --foreground: #16201a;
        --muted-foreground: #5e6b62;
        --border: #e0e4dc;

        /* Бренд: «спасённая еда» — зелёный */
        --brand: #1f9254;
        --brand-hover: #197a45;
        --brand-foreground: #ffffff;
        --brand-subtle: #e7f5ec;
        --brand-strong: #0e3f26;

        /* Акцент для скидок и «успей забрать» */
        --accent: #e8590c;
        --accent-subtle: #fdf0e6;

        --danger: #c92a2a;
        --danger-subtle: #fdecec;

        --radius: 0.75rem;
        --font-inter: "Inter", ui-sans-serif, system-ui, sans-serif;
      }

      body {
        background: var(--background);
        color: var(--foreground);
      }

      :focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
      }

      @keyframes savefood-rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .savefood-rise {
        animation: savefood-rise 0.5s ease-out both;
      }

      @media (prefers-reduced-motion: reduce) {
        .savefood-rise {
          animation: none;
        }
      }

      .savefood-marker {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.25rem 0.5rem;
        border: 2px solid var(--surface);
        border-radius: 999px;
        background: var(--brand);
        color: var(--brand-foreground);
        font: 600 0.75rem / 1 var(--font-inter), sans-serif;
        white-space: nowrap;
        cursor: pointer;
        box-shadow: 0 1px 4px rgb(0 0 0 / 0.3);
        transition:
          transform 0.12s ease,
          background-color 0.12s ease;
      }

      .savefood-marker:hover,
      .savefood-marker.is-active {
        background: var(--accent);
        transform: scale(1.12);
        z-index: 1;
      }

      .savefood-user-marker {
        width: 0.875rem;
        height: 0.875rem;
        border: 2px solid var(--surface);
        border-radius: 999px;
        background: #1c7ed6;
        box-shadow: 0 0 0 4px rgb(28 126 214 / 0.25);
      }
    </style>

      /** Разделители, названия месяцев и формат времени зависят от языка. */
      function makeFormatters() {
        return {
          time: new Intl.DateTimeFormat(t.locale, {
            timeZone: TZ,
            hour: "2-digit",
            minute: "2-digit",
            hour12: false,
          }),
          date: new Intl.DateTimeFormat(t.locale, {

          }),
          number: new Intl.NumberFormat(t.locale, {

        };
      }

      let fmt = makeFormatters();

      const formatTenge = (amount) => `${fmt.number.format(amount)} ₸`;

      function discountPercent(originalPrice, price) {
        if (originalPrice <= 0 || price >= originalPrice) return 0;
        return Math.floor(((originalPrice - price) / originalPrice) * 100);
      }

      function formatPickupWindow(start, end, now = new Date()) {
        const tomorrow = new Date(now.getTime() + 24 * 60 * 60 * 1000);
        let prefix;
        if (dayKeyFmt.format(start) === dayKeyFmt.format(now))
          prefix = t.today;
        else if (dayKeyFmt.format(start) === dayKeyFmt.format(tomorrow))
          prefix = t.tomorrow;
        else prefix = fmt.date.format(start);

        return `${prefix} ${fmt.time.format(start)} – ${fmt.time.format(end)}`;
      }

      function distanceKm(from, to) {
        const R = 6371;
        const toRad = (deg) => (deg * Math.PI) / 180;
        const dLat = toRad(to.lat - from.lat);
        const dLng = toRad(to.lng - from.lng);
        const a =
          Math.sin(dLat / 2) ** 2 +
          Math.cos(toRad(from.lat)) *
            Math.cos(toRad(to.lat)) *
            Math.sin(dLng / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }

      const ALMATY_OFFSET_HOURS = 5;

      /** Момент окна выдачи: сегодня/завтра по календарю Алматы. */
      function pickupAt(dayOffset, hour) {
        const nowLocal = new Date(Date.now() + ALMATY_OFFSET_HOURS * 3600000);
        return new Date(
          Date.UTC(
            nowLocal.getUTCFullYear(),
            nowLocal.getUTCMonth(),
            nowLocal.getUTCDate() + dayOffset,
            hour - ALMATY_OFFSET_HOURS,
          ),
        );
      }

      /**
       * Аналог findAvailableLocations: собирает партии на сегодня и завтра,
       * выбрасывает закрывшиеся окна и считает те же производные поля.
       */
      function buildLocations() {
        const now = new Date();

        return SEED.map((loc) => {
          const offers = loc.offers
            .map((offer) => {
              const batches = [0, 1]
                .map((dayOffset) => ({
                  id: `${offer.id}-${dayOffset}`,
                  pickupStart: pickupAt(dayOffset, offer.pickup[0]),
                  pickupEnd: pickupAt(dayOffset, offer.pickup[1]),
                  available: offer.quantity,
                }))
                .filter((b) => b.pickupEnd > now)
                .sort((a, b) => a.pickupStart - b.pickupStart);

              return {
                ...offer,
                imageUrl: offer.image ? unsplash(offer.image, 800) : null,
                batches,
              };
            })
            .filter((offer) => offer.batches.length > 0)
            .sort((a, b) => a.price - b.price);

          const allBatches = offers.flatMap((o) => o.batches);
          const nextBatch = allBatches.reduce(
            (earliest, b) =>
              !earliest || b.pickupStart < earliest.pickupStart ? b : earliest,
            null,
          );

          return {
            ...loc,
            imageUrl: loc.image ? unsplash(loc.image, 1400) : null,
            offers,
            minPrice: offers[0]?.price ?? 0,
            minPriceOriginal: offers[0]?.originalPrice ?? 0,
            totalAvailable: allBatches.reduce((sum, b) => sum + b.available, 0),
            nextPickup: nextBatch
              ? { start: nextBatch.pickupStart, end: nextBatch.pickupEnd }
              : null,
          };
        });
      }

              })
              .join("")}
          </ul>

          })
          .join("")}
      </div>`;

        return `
<main class="mx-auto w-full max-w-5xl flex-1 px-4 py-8">

          location.pickupNote
            ? `<p class="mt-2 rounded-card bg-brand-subtle px-3 py-2 text-brand">${esc(tr(location.pickupNote))}</p>`

        }
        ${

      </div>

      ${
        location.businessDescription

      /* ---------- Карта (src/components/map/maplibre-map.tsx) ---------- */
      const OSM_STYLE = {
        version: 8,
        sources: {
          osm: {
            type: "raster",
            tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
            tileSize: 256,
            maxzoom: 19,
            attribution: "© OpenStreetMap contributors",
          },
        },
        layers: [{ id: "osm", type: "raster", source: "osm" }],
      };

      const FALLBACK_CENTER = [76.8897, 43.2389];

      let map = null;
      const markerElements = new Map();

      function destroyMap() {
        if (map) {
          map.remove();
          map = null;
        }
        markerElements.clear();
      }

      function createMap(container, markers, { zoom = 12 } = {}) {
        destroyMap();

        map = new maplibregl.Map({
          container,
          style: OSM_STYLE,
          center: markers[0]
            ? [markers[0].lng, markers[0].lat]
            : FALLBACK_CENTER,
          zoom,
          attributionControl: { compact: true },
        });
        map.addControl(new maplibregl.NavigationControl(), "top-right");

        for (const marker of markers) {
          const el = document.createElement("button");
          el.type = "button";
          el.className = "savefood-marker";
          el.textContent = marker.badge ?? marker.title;
          el.title = marker.title;
          if (marker.href) {
            el.addEventListener("click", () => {
              location.hash = marker.href;
            });
          }
          el.addEventListener("mouseenter", () => setActive(marker.id));
          el.addEventListener("mouseleave", () => setActive(null));

          markerElements.set(marker.id, el);
          new maplibregl.Marker({ element: el })
            .setLngLat([marker.lng, marker.lat])
            .addTo(map);
        }

        if (userPosition) {
          const el = document.createElement("div");
          el.className = "savefood-user-marker";
          new maplibregl.Marker({ element: el })
            .setLngLat([userPosition.lng, userPosition.lat])
            .addTo(map);
        }

        // Несколько точек — показываем их все разом
        if (markers.length > 1) {
          const bounds = markers.reduce(
            (acc, m) => acc.extend([m.lng, m.lat]),
            new maplibregl.LngLatBounds(
              [markers[0].lng, markers[0].lat],
              [markers[0].lng, markers[0].lat],
            ),
          );
          map.fitBounds(bounds, { padding: 60, maxZoom: 14, duration: 0 });
        }
      }

      /** Подсветка пары «карточка ↔ маркер» без перерисовки страницы. */
      let activeId = null;
      function setActive(id) {
        if (activeId === id) return;

        for (const target of [activeId, id]) {
          if (!target) continue;
          const card = document.querySelector(`[data-card="${target}"]`);
          const isActive = target === id;
          if (card) {
            card.classList.toggle("border-brand", isActive);
            card.classList.toggle("bg-brand-subtle", isActive);
            card.classList.toggle("border-border", !isActive);
            card.classList.toggle("hover:border-brand", !isActive);
          }
          markerElements.get(target)?.classList.toggle("is-active", isActive);
        }

        activeId = id;
      }

      /* ---------- Роутер ---------- */
      const app = document.getElementById("app");

      function parseRoute() {
        const raw = location.hash.replace(/^#/, "") || "/";
        const [path, query = ""] = raw.split("?");
        return { path, params: new URLSearchParams(query) };
      }

      function render({ keepScroll = false } = {}) {
        const { path, params } = parseRoute();
        destroyMap();
        activeId = null;
        renderChrome();

        const place = path.match(/^\/places\/(.+)$/);

        if (path === "/explore") {
          app.innerHTML = exploreView(params);
          wireExplore(params);
        } else if (place) {
          app.innerHTML = placeView(decodeURIComponent(place[1]));
          wirePlace(decodeURIComponent(place[1]));
        } else {
          app.innerHTML = homeView();
        }

        if (!keepScroll) window.scrollTo({ top: 0 });
      }

      function setParam(key, value) {
        const { params } = parseRoute();
        if (value) params.set(key, value);
        else params.delete(key);
        const query = params.toString();
        location.hash = query ? `#/explore?${query}` : "#/explore";
        // Если хэш не изменился, hashchange не придёт — перерисовываем сами
        render();
      }

      function wireExplore(params) {
        for (const select of app.querySelectorAll("[data-filter]")) {
          select.addEventListener("change", (e) =>
            setParam(e.target.dataset.filter, e.target.value),
          );
        }

        app
          .querySelector("[data-reset-filters]")
          ?.addEventListener("click", () => {
            location.hash = "#/explore";
            render();
          });

        app.querySelector("[data-locate]")?.addEventListener("click", locateMe);

        for (const card of app.querySelectorAll("[data-card]")) {
          card.addEventListener("mouseenter", () =>
            setActive(card.dataset.card),
          );
          card.addEventListener("mouseleave", () => setActive(null));
        }

        const container = document.getElementById("explore-map");
        if (!container) return;

        const filters = {
          city: params.get("city") || undefined,
          category: params.get("category") || undefined,
          maxPrice: Number(params.get("maxPrice")) || undefined,
        };

        createMap(
          container,
          availableLocations(filters).map((l) => ({
            id: l.id,
            lat: l.lat,
            lng: l.lng,
            title: tr(l.title),
            badge: formatTenge(l.minPrice),
            href: `#/places/${l.id}`,
          })),
        );
      }

      function wirePlace(id) {
        for (const form of app.querySelectorAll("[data-booking]")) {
          form.addEventListener("submit", (e) => {
            e.preventDefault();
            const note = form.querySelector("[role=alert]");
            note.textContent = t.demoBooking;
            note.hidden = false;
          });
        }

        const place = ALL_LOCATIONS.find((l) => l.id === id);
        const container = document.getElementById("place-map");
        if (!place || !container) return;

        createMap(
          container,
          [
            {
              id: place.id,
              lat: place.lat,
              lng: place.lng,
              title: tr(place.title),
              badge: tr(place.title),
            },
          ],
          { zoom: 15 },
        );
      }

      function locateMe() {
        if (!navigator.geolocation) {
          geoError = "Браузер не умеет определять местоположение";
          render();
          return;
        }

        geoPending = true;
        geoError = null;
        render();

        navigator.geolocation.getCurrentPosition(
          (pos) => {
            userPosition = {
              lat: pos.coords.latitude,
              lng: pos.coords.longitude,
            };
            geoPending = false;
            render();
          },
          () => {
            geoError = "Не получилось определить местоположение";
            geoPending = false;
            render();
          },
          { timeout: 10000 },
        );
      }

      /** Регистрации в статичном демо нет — объясняем это вместо тихого клика. */
      document.addEventListener("click", (e) => {
        const button = e.target.closest("[data-demo-auth]");
        if (!button) return;
        alert(t.demoAuth);
      });

      /* ---------- Переключение языка ---------- */
      function setLang(next) {
        if (!LANGS.includes(next) || next === lang) return;

        lang = next;
        t = DICT[lang];
        fmt = makeFormatters();
        localStorage.setItem("savefood-demo-lang", lang);

        // Прокрутку сохраняем: язык меняют по ходу чтения, а не от начала
        const y = window.scrollY;
        render({ keepScroll: true });
        window.scrollTo(0, y);
      }

      function renderChrome() {
        document.documentElement.lang = lang;
        document.title = t.metaTitle;
        document
          .querySelector('meta[name="description"]')
          .setAttribute("content", t.metaDescription);

        document.getElementById("lang-switcher").innerHTML = LANGS.map(
          (code) => `
          <button type="button" data-set-lang="${code}" aria-pressed="${code === lang}"
                  class="rounded-card px-2 py-1 text-xs font-semibold transition-colors ${
                    code === lang
                      ? "bg-brand-subtle text-brand"
                      : "text-muted-foreground hover:text-foreground"
                  }">${LANG_LABELS[code]}</button>`,
        ).join("");

        document.getElementById("nav-login").textContent = t.login;
        document.getElementById("nav-start").textContent = t.start;
        document.getElementById("site-footer").textContent = t.footer;
      }

      document.addEventListener("click", (e) => {
        const button = e.target.closest("[data-set-lang]");
        if (button) setLang(button.dataset.setLang);
      });

      window.addEventListener("hashchange", render);
      render();
    </script>
  </body>
</html>
